[advisories]
version = 2

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "OFL-1.1",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Ubuntu-font-1.0",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
