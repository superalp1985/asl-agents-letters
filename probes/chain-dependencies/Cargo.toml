[package]
name = "asl-chain-dependency-probe"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.95"

[workspace]

[dependencies]
helios-consensus-core = { path = "../../vendor/helios-consensus-core", version = "=0.12.0" }
alloy-provider = { version = "=2.6.1", default-features = false }
alloy-primitives = { version = "=1.7.3", features = ["rlp"] }
alloy-rlp = "=0.3.17"
alloy-trie = { version = "=0.9.9", features = ["ethereum"] }
