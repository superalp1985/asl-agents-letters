[package]
name = "asl-policy"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
appcontainer-loopback-fixture = []

[dependencies]
asl-types = { path = "../asl-types" }
blake3.workspace = true
hex.workspace = true
rand.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile = "=3.27.0"

[target.'cfg(windows)'.dependencies]
tokio = { workspace = true, features = ["net"] }
windows = { version = "=0.62.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Security_Isolation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Diagnostics_Debug", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.dev-dependencies]
tokio = { workspace = true, features = ["io-util"] }

[target.'cfg(target_os = "linux")'.dependencies]
chacha20poly1305 = "=0.10.1"
image = { workspace = true }
ksni = { version = "=0.3.8", default-features = false, features = ["blocking", "tokio"] }
libc = "=0.2.191"
notify-rust = { version = "=4.19.0", default-features = false, features = ["z-with-tokio"] }
rfd = { version = "=0.18.0", default-features = false, features = ["xdg-portal"] }
rustix = { version = "=1.1.6", features = ["fs", "param", "pipe", "process", "thread", "time"] }
tokio = { workspace = true, features = ["net"] }
