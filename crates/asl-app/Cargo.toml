[package]
name = "asl-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
asl-agent = { path = "../asl-agent" }
asl-groups = { path = "../asl-groups" }
asl-policy = { path = "../asl-policy" }
asl-net = { path = "../asl-net" }
asl-types = { path = "../asl-types" }
asl-store = { path = "../asl-store" }
asl-transfer = { path = "../asl-transfer" }
k256.workspace = true
libp2p-identity = { workspace = true, features = ["ed25519", "rand"] }
rand.workspace = true
sha3.workspace = true
sha2 = "=0.11.1"
spake2 = "=0.4.0"
semver = "=1.0.28"
ed25519-dalek = { version = "=2.2.0", default-features = false }
zeroize.workspace = true
alloy-primitives.workspace = true
alloy-rlp.workspace = true
alloy-trie.workspace = true
alloy-consensus.workspace = true
helios-consensus-core.workspace = true
serde.workspace = true
serde_json.workspace = true
bs58.workspace = true
cbor2.workspace = true
blake3.workspace = true
image.workspace = true
alloy-rpc-types-eth.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
toml_edit = { version = "=0.25.19", default-features = false, features = ["parse", "serde"] }
pdf-extract = "=0.12.1"
quick-xml = { version = "=0.41.0", features = ["encoding"] }
zip = { version = "=9.8.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
openmls.workspace = true
openmls_basic_credential = "=0.6.0"
curve25519-dalek = { version = "=4.1.3", default-features = false }
qrcodegen = { workspace = true, optional = true }
age = { version = "=0.11.4", default-features = false }
rpassword = "=7.5.4"
tempfile = "=3.27.0"
rmcp.workspace = true
snow = "=0.10.0"

[dev-dependencies]
asl-policy = { path = "../asl-policy", features = ["appcontainer-loopback-fixture"] }
eframe.workspace = true
rmcp.workspace = true
rusqlite.workspace = true
openmls_rust_crypto = "=0.6.0"

[features]
desktop-ui = ["dep:eframe", "dep:qrcodegen"]

[target.'cfg(any(windows, target_os = "linux"))'.dependencies.eframe]
workspace = true
optional = true

[[bin]]
name = "asl-ui"
path = "src/bin/asl-ui.rs"
required-features = ["desktop-ui"]
