[workspace]
members = [
    "crates/asl-types",
    "crates/asl-store",
    "crates/asl-policy",
    "crates/asl-transfer",
    "crates/asl-net",
    "crates/asl-groups",
    "crates/asl-agent",
    "crates/asl-app",
]
resolver = "3"
exclude = ["vendor/helios-consensus-core", "probes/chain-dependencies"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
cbor2 = "=1.1.6"
libp2p = { version = "=0.57.1", default-features = false, features = [
    "autonat",
    "dcutr",
    "ed25519",
    "identify",
    "kad",
    "macros",
    "mdns",
    "noise",
    "ping",
    "quic",
    "relay",
    "request-response",
    "tcp",
    "tokio",
    "yamux",
] }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
eframe = { version = "=0.35.0", default-features = false, features = ["default_fonts", "glow"] }
rusqlite = { version = "=0.43.0", features = ["bundled-full"] }
rmcp = { version = "=3.10.0", features = ["server", "macros", "transport-io"] }
openmls = "=0.9.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
libp2p-identity = { version = "=0.3.1", features = ["peerid"] }
bs58 = "=0.5.1"
blake3 = "=1.8.7"
hex = "=0.4.3"
k256 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "getrandom", "std"] }
rand = "=0.10.4"
sha3 = "=0.12.0"
zeroize = "=1.9.1"
alloy-primitives = { version = "=1.7.3", default-features = false, features = ["std", "rlp"] }
alloy-rlp = "=0.3.17"
alloy-trie = { version = "=0.9.9", default-features = false, features = ["std", "ethereum"] }
alloy-consensus = { version = "=2.6.1", default-features = false, features = ["std"] }
helios-consensus-core = { path = "vendor/helios-consensus-core", version = "=0.12.0" }
alloy-rpc-types-eth = { version = "=2.6.1", default-features = false, features = ["std", "serde"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls", "json"] }
