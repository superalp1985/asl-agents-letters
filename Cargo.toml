[workspace]
members = [
    "crates/asl-types",
    "crates/asl-store",
    "crates/asl-policy",
    "crates/asl-transfer",
    "crates/asl-net",
    "crates/asl-groups",
    "crates/asl-agent",
    "crates/asl-app",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
libp2p = { version = "=0.57.1", default-features = false, features = [
    "autonat",
    "dcutr",
    "ed25519",
    "identify",
    "kad",
    "macros",
    "mdns",
    "noise",
    "ping",
    "quic",
    "relay",
    "request-response",
    "tcp",
    "tokio",
    "yamux",
] }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
eframe = { version = "=0.35.0", default-features = false, features = ["default_fonts", "glow"] }
rusqlite = { version = "=0.43.0", features = ["bundled-full"] }
rmcp = { version = "=3.10.0", features = ["server", "macros", "transport-io"] }
openmls = "=0.9.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
libp2p-identity = { version = "=0.3.1", features = ["peerid"] }
bs58 = "=0.5.1"
blake3 = "=1.8.7"
